# ==============================================================================
# SCHEDULE.CFG — MPV State Machine Schedule
# ==============================================================================
#
# FILE ORDER = PRIORITY. Top = lowest priority. Bottom = highest priority.
# On any timing conflict, the entry closest to the bottom wins.
#
# FORMAT:
#   loop   LOOP_ID   START_TIME   END_TIME    (window, overnight wraps work)
#   media  MEDIA_ID  TRIGGER_TIME             (one-shot, fires once per minute)
#
# Times are 24h HH:MM format.
# Loop IDs must match a folder in content/ (e.g. L1 matches "L1" or "L1 - Label")
#
# ==============================================================================

# LAYER 1 (lowest priority) — seasonal loop all day
# loop  L1  00:00  23:59

# LAYER 2 — override back to default during business hours
# L0 wins from 09:00-17:00 because it appears lower in the file
# loop  L0  09:00  17:00

# LAYER 3 (highest priority) — scheduled media triggers
# media  M2  12:00
# media  M3  15:00
