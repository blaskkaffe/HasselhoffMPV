# ==============================================================================
# schedule.cfg — when should the player switch loops or fire media on its own?
# ==============================================================================
#
# Lines starting with # are ignored. Every line below is an example: remove the
# leading "# " from the ones you want. With nothing active the player simply
# stays on the default loop (L0) and reacts to keys.
#
# FORMAT
#   loop   L1  START  END  [FROM-DATE  TO-DATE]
#   media  M2  TIME        [FROM-DATE  TO-DATE]
#
#   Times are 24h HH:MM.  Dates are MM-DD, repeat every year, and may wrap the
#   New Year (12-01 01-06 = Dec 1 through Jan 6).
#   A loop line is active between START and END (overnight works: 22:00 06:00).
#   A media line fires once at TIME.
#
# PRIORITY
#   Lines LOWER in this file win over lines above them when they overlap.
#
# BEHAVIOUR
#   * A loop change or media trigger that arrives while media is playing waits
#     until that media has finished.
#   * The schedule only acts when what it WANTS changes. If you press F2 by hand
#     the player stays on L2 until the schedule next changes its mind.
#   * A loop that has no folder in content/ is ignored (one warning in the log).
# ==============================================================================


# Christmas loop (L1) all day from Dec 1 to Jan 6:
# loop   L1  00:00  23:59  12-01  01-06

# ...but a special loop (L2) on New Year's Eve evening; being lower in the file
# it beats the Christmas line above:
# loop   L2  18:00  23:59  12-31  12-31

# Play media mode M2 every day at noon:
# media  M2  12:00

# Play media mode M3 at 15:00 only during the Christmas period:
# media  M3  15:00  12-01  12-24
