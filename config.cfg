# ==============================================================================
# CONFIG.CFG — MPV State Machine External Configuration
# ==============================================================================
#
# Optional. If this file is missing, mediaplayer.lua falls back to its
# built-in defaults (SECTION 2 for globals, SECTION 3 for per-mode). Every
# line below is commented out — uncomment and edit a line to change that
# setting without touching the Lua script. See mediaplayer.lua SECTION 6
# for the loader itself.
#
# GLOBAL SETTINGS
# -----------------
#   key = value
#   Keys are case-insensitive and must match a CONFIG.* field in SECTION 2
#   (e.g. "default_loop" -> DEFAULT_LOOP). Unknown keys are warned about
#   and skipped.
#
# PER-MODE / PER-LOOP OVERRIDES
# --------------------------------
#   [M1]            media mode section -> overrides just that mode
#   order = shuffle
#
#   [L1]            loop section -> overrides just that loop
#   order = pingpong
#
# Values are auto-typed: true/false -> boolean, numeric strings -> number,
# anything else stays a string. config.cfg wins per-key over hard-coded
# SECTION 3 values; anything not mentioned here keeps its old value.
#
# ==============================================================================

# ---- Global settings (SECTION 2 defaults) ----
# tick_interval        = 1.0
# default_loop         = L0
# default_order        = sequential
# cutscene_order       = random
# clips_per_trigger    = 1
# seconds_per_trigger  = 0
# lock_keys            = false
# key_cancel           = false
# cutscene_on_trigger  = true
# cutscene_on_return   = true
# cutscene_on_switch   = true
# loop_muted           = true

# ---- Per-mode / per-loop overrides (SECTION 3 examples) ----
# [M1]
# order = shuffle
# clips_per_trigger = 2
# cutscene_on_trigger = true
#
# [M2]
# lock_keys = true
# order = random
#
# [L1]
# order = pingpong
# cutscene_on_switch = true
