# ==============================================================================
# config.cfg - settings for mediaplayer.lua, in plain text
# ==============================================================================
# Optional. Every line below is an example: remove the leading "# " to use it.
# Anything you set here wins over the values inside mediaplayer.lua; anything
# you leave out keeps the value from mediaplayer.lua. Edit, save, then press
# Ctrl+q on the player (or reboot it) to apply.
#
#   name = value          a global setting (any upper/lower case)
#   [M1]                  starts the settings for media mode M1 (M2, Ma ...)
#   [L1]                  starts the settings for loop L1 (L2, L12 ...)
#
# Values: true / false, numbers, or text (quotes optional).
# Unknown names are reported in the log and skipped; they never stop the player.
# ==============================================================================

# ---- Playback ----
# default_loop        = L0          # loop used when the schedule has no opinion
# default_order       = random      # sequential | reverse | pingpong | shuffle | random
# cutscene_order      = random      # sequential | shuffle | random
# clips_per_trigger   = 1           # clips per key press (0 = until interrupted)
# seconds_per_trigger = 0           # stop media after N seconds (0 = off)
# loop_muted          = true        # loops are silent

# ---- Keys ----
# lock_keys           = false       # true: ignore every key while media plays
# key_cancel          = false       # true: pressing the same key again cancels
# quit_key            = "Ctrl+q"    # "" removes the restart key completely

# ---- Cutscenes (Intro / Outro / Transition folders) ----
# cutscene_on_trigger = true        # Intro before a media mode
# cutscene_on_return  = false       # Outro after a media mode
# cutscene_on_switch  = false       # Transition when the loop changes

# ---- Fades ----
# fade_enabled        = true
# fade_out_duration   = 0.4
# fade_black_hold     = 0.1
# fade_in_duration    = 0.4
# fade_before_end     = true

# ---- Music and overlays ----
# music_volume        = 100         # 0-100
# music_fade_in       = 0           # seconds (0 = songs start plainly)
# overlays            = true        # false switches every overlay off
# overlays_on_cutscenes = false

# ---- Per-mode / per-loop overrides ----
# [M1]
# order = shuffle
# clips_per_trigger = 2
# cutscene_on_return = true
#
# [M3]
# order = pingpong
# seconds_per_trigger = 30
# key_cancel = true
# overlays = false                  # no overlays in this mode
# visual_loop = L5                  # songs show this loop's video
#
# [L1]
# order = pingpong
# cutscene_on_switch = true
